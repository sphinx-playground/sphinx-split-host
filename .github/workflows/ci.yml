name: Continuous Integration - Remote Docs Compilation - Split Repos

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the independent documentation repository into a dedicated workspace directory:
      - name: Checkout Documentation
        uses: actions/checkout@v4

      # 2. Checkout the independent code repository into a dedicated parallel sibling workspace directory:      
      - name: Checkout Sibling Code
        uses: actions/checkout@v4
        with:
          repository: sphinx-playground/sphinx-split-guest
          path: sphinx-split-guest

      # 3. Provide a clean, predictable Python execution environment:
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Upgrade package managers and fetch necessary documentation engines:
      - name: Install Sphinx Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme

      # 5. Compile documentation by pointing to the sibling code folder path:
      - name: Compile Sphinx Documentation
        run: |
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}/sphinx-split-sphinx"
          sphinx-build -b html sphinx sphinx/_build/html

      # 6. Securely package the static HTML folder as a native website asset:
      - name: Upload HTML Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sphinx/_build/html

  # --- Deployment Pipeline Sequence ---
  deploy-site:
    needs: build-docs
    runs-on: ubuntu-latest
    steps:
    - name: Stream Site Live to GitHub Pages
      uses: actions/deploy-pages@v4
